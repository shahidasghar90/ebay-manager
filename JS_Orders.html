<script>
  let editingOrderId = null;

  function setupOrderForm() {
    const form = document.getElementById('orderForm');

    ['input', 'change'].forEach(eventName => {
      form.querySelector('[name="sku"]').addEventListener(eventName, () => {
        fillOrderFieldsFromSku(form);
      });
    });

    document.getElementById('showOrderForm').addEventListener('click', () => {
      resetOrderForm();
      openOrderModal();
    });

    document.getElementById('closeOrderModal').addEventListener('click', closeOrderModal);
    document.getElementById('orderFormModal').addEventListener('click', event => {
      if (event.target.id === 'orderFormModal') closeOrderModal();
    });

    form.addEventListener('submit', event => {
      event.preventDefault();

      const isEditing = !!editingOrderId;
      const button = document.getElementById('orderSubmitButton');
      button.disabled = true;
      button.textContent = isEditing ? 'Updating...' : 'Saving...';

      const run = google.script.run
        .withSuccessHandler(result => {
          showToast(
            isEditing
              ? `Order updated: ${result.orderId}. Net profit: ${formatMoney(result.netProfit)}`
              : `Order saved: ${result.orderId}. Net profit: ${formatMoney(result.netProfit)}`
          );
          upsertRecord(appData.orders, 'Order ID', result.record);
          renderOrders();
          resetOrderForm();
          closeOrderModal();
          loadAppData();
        })
        .withFailureHandler(error => {
          showToast(error.message || 'Could not save order.', true);
          button.disabled = false;
          button.textContent = isEditing ? 'Update Order' : 'Save Order';
        });

      if (isEditing) {
        run.updateOrder(formToObject(form));
      } else {
        run.saveOrder(formToObject(form));
      }
    });
  }

  function resetOrderForm() {
    editingOrderId = null;

    const form = document.getElementById('orderForm');
    form.reset();
    setField(form, 'orderId', '');

    document.getElementById('orderFormTitle').textContent = 'Add Order';
    document.getElementById('orderSubmitButton').textContent = 'Save Order';
  }

  function openOrderModal() {
    document.getElementById('orderFormModal').classList.remove('hidden');
  }

  function closeOrderModal() {
    document.getElementById('orderFormModal').classList.add('hidden');
  }

  function editOrder(orderId) {
    const order = (appData.orders || []).find(o => String(o['Order ID']) === String(orderId));

    if (!order) return;

    editingOrderId = orderId;

    const form = document.getElementById('orderForm');
    form.reset();

    setField(form, 'orderId', order['Order ID']);
    setField(form, 'orderDate', String(order['Order Date'] || '').substring(0, 10));
    setField(form, 'salesPlatform', order['Sales Platform']);
    setField(form, 'sku', order['SKU']);
    setField(form, 'productName', order['Product Name']);
    setField(form, 'buyerUsername', order['Buyer Username']);
    setField(form, 'quantity', order['Quantity']);
    setField(form, 'saleCurrency', order['Sale Currency']);
    setField(form, 'itemPriceLocal', order['Item Price Local']);
    setField(form, 'shippingChargedLocal', order['Shipping Charged Local']);
    setField(form, 'productCostEur', order['Product Cost EUR']);
    setField(form, 'shippingPackagingCostEur', order['Shipping/Packaging Cost EUR']);
    setField(form, 'fulfillmentType', order['Fulfillment Type']);
    setField(form, 'orderStatus', order['Order Status']);
    setField(form, 'buyerTrackingNumber', order['Buyer Tracking Number']);
    setField(form, 'notes', order['Notes']);

    document.getElementById('orderFormTitle').textContent = `Edit Order — ${orderId}`;
    document.getElementById('orderSubmitButton').textContent = 'Update Order';
    openOrderModal();
  }

  function fillOrderFieldsFromSku(form) {
    const sku = form.querySelector('[name="sku"]').value.trim();
    const product = (appData.products || []).find(p => p['SKU'] === sku);

    if (!product) return;

    setField(form, 'productName', product['Product Name']);
    setField(form, 'saleCurrency', 'EUR');
    setField(form, 'itemPriceLocal', round2Display(product['Current Sale Price EUR']));
    setField(form, 'productCostEur', round2Display(product['Total Cost EUR']));
  }

  function round2Display(value) {
    const number = Number(value || 0);
    return Math.round((number + Number.EPSILON) * 100) / 100;
  }

  function renderOrderSkuOptions() {
    const datalist = document.getElementById('orderSkuOptions');

    datalist.innerHTML = (appData.products || [])
      .filter(product => product['Product Status'] !== 'Archived')
      .map(product => `<option value="${escapeHtml(product['SKU'])}">${escapeHtml(product['Product Name'] || '')}</option>`)
      .join('');
  }

  function renderOrders() {
    const body = document.getElementById('ordersTable');
    const orders = [...(appData.orders || [])]
      .sort((a, b) => new Date(b['Order Date']) - new Date(a['Order Date']));

    if (!orders.length) {
      body.innerHTML = `
        <tr>
          <td colspan="8" class="empty">No orders available.</td>
        </tr>
      `;
      return;
    }

    body.innerHTML = orders.map(order => `
      <tr>
        <td>${escapeHtml(order['Order ID'])}</td>
        <td>${formatDate(order['Order Date'])}</td>
        <td>${escapeHtml(order['SKU'])}</td>
        <td>${escapeHtml(order['Buyer Username'])}</td>
        <td>${formatMoney(order['Gross Sale EUR'])}</td>
        <td>${formatMoney(order['Net Profit EUR'])}</td>
        <td>${statusBadge(order['Order Status'])}</td>
        <td>
          <div class="action-buttons">
            <button onclick="editOrder('${escapeHtml(order['Order ID'])}')">Edit</button>
          </div>
        </td>
      </tr>
    `).join('');
  }
</script>
