<style>
  :root {
    --navy: #0f172a;
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --page: #f4f7fb;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #172033;
    --muted: #64748b;
    --green: #15803d;
    --orange: #c2410c;
    --red: #b91c1c;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .app-shell {
    min-height: 100vh;
    display: flex;
  }

  .sidebar {
    width: 250px;
    background: var(--navy);
    color: #fff;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 0 8px 28px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    position: relative;
  }

  .sidebar-close,
  .hamburger-btn {
    display: none;
  }

  .sidebar-backdrop {
    display: none;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--blue);
    font-size: 24px;
    font-weight: 700;
  }

  .brand h1 {
    margin: 0;
    font-size: 16px;
  }

  .brand p {
    margin: 4px 0 0;
    color: #94a3b8;
    font-size: 12px;
  }

  .menu {
    margin-top: 22px;
    display: grid;
    gap: 7px;
  }

  .nav-item {
    background: transparent;
    color: #cbd5e1;
    border: 0;
    border-radius: 8px;
    padding: 11px 12px;
    text-align: left;
    font-weight: 600;
  }

  .nav-item:hover,
  .nav-item.active {
    background: rgba(37, 99, 235, 0.22);
    color: #fff;
  }

  .nav-item span {
    display: inline-block;
    width: 26px;
  }

  .sidebar-footer {
    margin-top: auto;
    color: #94a3b8;
    font-size: 12px;
    padding: 16px 8px 0;
  }

  .dot {
    width: 8px;
    height: 8px;
    display: inline-block;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 6px;
  }

  .main-content {
    flex: 1;
    min-width: 0;
    padding: 28px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
  }

  .topbar h2 {
    margin: 0;
    font-size: 27px;
  }

  .topbar p {
    margin: 6px 0 0;
    color: var(--muted);
  }

  .topbar-actions,
  .page-actions,
  .form-footer {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .primary-btn,
  .secondary-btn,
  .text-button {
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: 700;
    border: 1px solid transparent;
  }

  .primary-btn {
    background: var(--blue);
    color: #fff;
  }

  .primary-btn:hover {
    background: var(--blue-dark);
  }

  .secondary-btn {
    background: #fff;
    color: var(--text);
    border-color: var(--border);
  }

  .text-button {
    background: transparent;
    color: var(--blue);
    padding: 6px;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(180px, 1fr));
    gap: 16px;
  }

  .stat-card,
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 2px 9px rgba(15, 23, 42, 0.04);
  }

  .stat-card {
    padding: 18px;
  }

  .stat-card strong {
    display: block;
    margin: 8px 0;
    font-size: 28px;
  }

  .stat-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .stat-card small {
    color: var(--muted);
  }

  .stat-card.success strong {
    color: var(--green);
  }

  .stat-card.warning strong {
    color: var(--orange);
  }

  .stat-card.danger strong {
    color: var(--red);
  }

  .dashboard-panels {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }

  .panel {
    padding: 18px;
  }

  .panel-title-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .panel-title-row h3,
  .page-actions h3 {
    margin: 0;
    font-size: 18px;
  }

  .panel-title-row p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .quick-actions {
    display: grid;
    gap: 10px;
  }

  .quick-actions button {
    padding: 12px;
    background: #f8fafc;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: left;
    font-weight: 700;
  }

  .quick-actions button:hover {
    border-color: var(--blue);
    color: var(--blue);
  }

  .page-actions {
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .search-input {
    width: min(420px, 100%);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    background: #fff;
  }

  .table-panel {
    padding: 0;
    overflow: hidden;
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 720px;
  }

  th,
  td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  th {
    background: #f8fafc;
    color: #475569;
    font-size: 12px;
    text-transform: uppercase;
  }

  tr:hover td {
    background: #fbfdff;
  }

  .status {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 11px;
  }

  .status.active,
  .status.delivered {
    background: #dcfce7;
    color: #166534;
  }

  .status.research,
  .status.processing {
    background: #fef3c7;
    color: #92400e;
  }

  .status.paused,
  .status.cancelled {
    background: #fee2e2;
    color: #991b1b;
  }

  .form-panel {
    max-width: 1100px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  label {
    display: grid;
    gap: 7px;
    color: #334155;
    font-size: 13px;
    font-weight: 700;
  }

  label.full {
    grid-column: 1 / -1;
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    padding: 10px;
    color: var(--text);
    background: #fff;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: 2px solid rgba(37, 99, 235, 0.18);
    border-color: var(--blue);
  }

  textarea {
    resize: vertical;
  }

  .form-footer {
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .hidden {
    display: none;
  }

  .field-hint {
    color: var(--muted);
    font-weight: 400;
    font-size: 11px;
    margin-top: -2px;
  }

  .toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    max-width: 360px;
    padding: 13px 15px;
    border-radius: 9px;
    color: #fff;
    background: #0f172a;
    transform: translateY(120px);
    opacity: 0;
    transition: 0.25s ease;
    font-size: 14px;
    font-weight: 700;
    z-index: 100;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .toast.error {
    background: #b91c1c;
  }

  .empty {
    color: var(--muted);
    padding: 18px;
    text-align: center;
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }

  .filter-row select {
    width: auto;
    min-width: 150px;
    background: #fff;
  }

  .row-thumb {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 6px;
    background: #f1f5f9;
    display: block;
    cursor: pointer;
  }

  .action-buttons {
    display: flex;
    gap: 6px;
  }

  .action-buttons button {
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
  }

  .action-buttons button:hover {
    border-color: var(--blue);
    color: var(--blue);
  }

  .action-buttons button.danger:hover {
    border-color: var(--red);
    color: var(--red);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }

  .modal-overlay.hidden {
    display: none;
  }

  .modal-box {
    background: #fff;
    border-radius: 12px;
    max-width: 760px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal-box-wide {
    max-width: 900px;
  }

  .modal-box-wide .modal-body {
    display: block;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .modal-header h3 {
    margin: 0;
  }

  .modal-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .modal-body img {
    max-width: 220px;
    border-radius: 8px;
  }

  .modal-section h4 {
    margin: 0 0 10px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--blue);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }

  .modal-section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }

  .modal-field span {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  .modal-field strong {
    font-size: 14px;
    word-break: break-word;
  }

  .image-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }

  .gallery-thumb {
    position: relative;
    width: 72px;
    height: 72px;
  }

  .gallery-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #f8fafc;
  }

  .gallery-thumb button {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    border: 2px solid #fff;
    font-size: 11px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
  }

  .modal-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .modal-gallery img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
  }

  .profit-preview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin: 18px 0;
  }

  .profit-preview div {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .profit-preview span {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  .profit-preview strong {
    font-size: 18px;
  }

  .profit-preview strong.negative {
    color: var(--red);
  }

  .profit-preview strong.positive {
    color: var(--green);
  }

  .topbar-title {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  @media (max-width: 900px) {
    .app-shell {
      position: relative;
      overflow-x: hidden;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.25);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-close {
      display: block;
      position: absolute;
      right: 0;
      top: 0;
      background: transparent;
      border: 0;
      color: #fff;
      font-size: 18px;
      padding: 6px;
    }

    .hamburger-btn {
      display: block;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 18px;
      padding: 8px 12px;
      line-height: 1;
      flex-shrink: 0;
    }

    .sidebar-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 250;
    }

    .sidebar-backdrop.hidden {
      display: none;
    }

    .stats-grid,
    .dashboard-panels {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 620px) {
    .main-content {
      padding: 16px;
    }

    .topbar,
    .page-actions {
      align-items: stretch;
      flex-direction: column;
    }

    .topbar h2 {
      font-size: 21px;
    }

    .topbar-actions {
      width: 100%;
    }

    .topbar-actions button,
    .page-actions > button,
    .page-actions > .search-input {
      flex: 1 1 auto;
      width: 100%;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }

    label.full {
      grid-column: auto;
    }

    .filter-row select {
      flex: 1 1 calc(50% - 5px);
      min-width: 0;
    }

    table {
      min-width: 560px;
    }

    .toast {
      left: 16px;
      right: 16px;
      bottom: 16px;
      max-width: none;
    }

    .modal-header {
      padding: 14px 16px;
    }

    .modal-body {
      padding: 16px;
    }

    .action-buttons {
      flex-wrap: wrap;
    }

    .form-footer button {
      flex: 1 1 auto;
    }
  }
</style>
