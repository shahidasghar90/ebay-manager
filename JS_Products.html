<script>
  function setupProductForm() {
    document.getElementById('productForm').addEventListener('submit', event => {
      event.preventDefault();

      if (imageUploadCount > 0) {
        showToast('Images are still uploading, please wait a moment and try again.', true);
        return;
      }

      const isEditing = !!editingProductSku;
      const button = event.target.querySelector('button[type="submit"]');
      button.disabled = true;
      button.textContent = isEditing ? 'Updating...' : 'Saving...';

      const run = google.script.run
        .withSuccessHandler(result => {
          showToast(
            isEditing
              ? `Product updated: ${result.sku}.`
              : `Product saved: ${result.sku}. Estimated profit: ${formatMoney(result.estimatedProfit)}`
          );
          upsertRecord(appData.products, 'SKU', result.record);
          renderProducts();
          resetProductFormForAdd();
          loadAppData();
          showPage('products');
        })
        .withFailureHandler(error => {
          showToast(error.message || 'Could not save product.', true);
          button.disabled = false;
          button.textContent = isEditing ? 'Update Product' : 'Save Product';
        });

      if (isEditing) {
        run.updateProduct(formToObject(event.target));
      } else {
        run.saveProduct(formToObject(event.target));
      }
    });
  }

  /* =========================
     IMAGE UPLOAD (up to 5 photos, sorted into Drive by condition/category)
  ========================= */

  const MAX_PRODUCT_IMAGES = 5;

  function setupImageUpload() {
    const fileInput = document.getElementById('productImageFile');
    const form = document.getElementById('productForm');

    fileInput.addEventListener('change', () => {
      const selected = Array.from(fileInput.files);
      fileInput.value = '';

      if (!selected.length) return;

      const remaining = MAX_PRODUCT_IMAGES - currentImages.length;

      if (remaining <= 0) {
        showToast(`Maximum ${MAX_PRODUCT_IMAGES} photos per product.`, true);
        return;
      }

      uploadProductImagesSequentially(selected.slice(0, remaining), form);
    });
  }

  function uploadProductImagesSequentially(files, form) {
    if (!files.length) return;

    const [next, ...rest] = files;

    uploadOneProductImage(next, form, () => {
      uploadProductImagesSequentially(rest, form);
    });
  }

  function uploadOneProductImage(file, form, onDone) {
    const reader = new FileReader();

    reader.onload = () => {
      setImageUploadingState(true);

      google.script.run
        .withSuccessHandler(result => {
          currentImages.push({ url: result.url, fileId: result.fileId });
          syncImageFields(form);
          renderImageGallery();
          setImageUploadingState(false);
          showToast('Image uploaded to Drive.');
          if (onDone) onDone();
        })
        .withFailureHandler(error => {
          setImageUploadingState(false);
          showToast(error.message || 'Image upload failed.', true);
          if (onDone) onDone();
        })
        .uploadImageToDrive(
          reader.result,
          file.name,
          form.querySelector('[name="productName"]').value || 'product',
          form.querySelector('[name="condition"]').value,
          form.querySelector('[name="category"]').value
        );
    };

    reader.readAsDataURL(file);
  }

  function setImageUploadingState(uploading) {
    const button = document.getElementById('productForm').querySelector('button[type="submit"]');

    if (uploading) {
      imageUploadCount++;
      button.disabled = true;
      button.textContent = 'Uploading image...';
      return;
    }

    imageUploadCount = Math.max(0, imageUploadCount - 1);

    if (imageUploadCount === 0) {
      button.disabled = false;
      button.textContent = editingProductSku ? 'Update Product' : 'Save Product';
    }
  }

  function renderImageGallery() {
    const gallery = document.getElementById('productImageGallery');

    gallery.innerHTML = currentImages.map((image, index) => `
      <div class="gallery-thumb">
        <img src="${escapeHtml(image.url)}" alt="">
        <button type="button" onclick="removeProductImage(${index})">✕</button>
      </div>
    `).join('');
  }

  function removeProductImage(index) {
    currentImages.splice(index, 1);
    syncImageFields(document.getElementById('productForm'));
    renderImageGallery();
  }

  function syncImageFields(form) {
    form.querySelector('[name="imageUrl"]').value = JSON.stringify(currentImages.map(i => i.url));
    form.querySelector('[name="imageFileId"]').value = JSON.stringify(currentImages.map(i => i.fileId));
  }

  function resetImageGallery() {
    currentImages = [];
    document.getElementById('productImageGallery').innerHTML = '';
    document.getElementById('productImageFile').value = '';
  }

  /* =========================
     LIVE PROFIT PREVIEW
  ========================= */

  function setupProfitPreview() {
    const form = document.getElementById('productForm');
    const watchedFields = [
      'currency',
      'purchasePriceLocal',
      'shippingToYouLocal',
      'customsDutyEur',
      'packagingEur',
      'refurbishmentEur',
      'dropshipCustomerShippingEur',
      'dropshipHandlingFeeEur',
      'currentSalePriceEur',
      'targetProfitPercent'
    ];

    watchedFields.forEach(name => {
      const field = form.querySelector(`[name="${name}"]`);

      if (field) {
        field.addEventListener('input', updateProfitPreview);
        field.addEventListener('change', updateProfitPreview);
      }
    });

    form.querySelector('[name="condition"]').addEventListener('change', updateConditionalFields);
    form.querySelector('[name="businessModel"]').addEventListener('change', updateConditionalFields);

    updateConditionalFields();
    updateProfitPreview();
  }

  function updateConditionalFields() {
    const form = document.getElementById('productForm');
    const condition = form.querySelector('[name="condition"]').value;
    const businessModel = form.querySelector('[name="businessModel"]').value;
    const isDropship = businessModel === 'Dropship' || businessModel === 'Hybrid';

    document.getElementById('fieldRefurbishment').classList.toggle('hidden', condition !== 'Refurbished');
    document.getElementById('fieldDropshipShipping').classList.toggle('hidden', !isDropship);
    document.getElementById('fieldDropshipHandling').classList.toggle('hidden', !isDropship);
    document.getElementById('fieldDropshipSupported').classList.toggle('hidden', !isDropship);
  }

  function updateProfitPreview() {
    const form = document.getElementById('productForm');
    const data = formToObject(form);
    const settings = appData.settings || {};
    const fxRates = settings.fxRates || { EUR: 1, USD: 1, PKR: 1 };

    const rate = fxRates[data.currency] || 1;
    const purchaseEur = num(data.purchasePriceLocal) * rate;
    const shippingEur = num(data.shippingToYouLocal) * rate;

    const totalCost =
      purchaseEur +
      shippingEur +
      num(data.customsDutyEur) +
      num(data.packagingEur) +
      num(data.refurbishmentEur) +
      num(data.dropshipCustomerShippingEur) +
      num(data.dropshipHandlingFeeEur);

    const ebayFeePercent = settings.ebayFeePercent || 0.129;
    const paymentFeePercent = settings.paymentFeePercent || 0.029;
    const fixedFee = settings.fixedPaymentFeeEur || 0.35;
    const targetProfit = num(data.targetProfitPercent, 0.25);
    const salePrice = num(data.currentSalePriceEur);

    const breakeven =
      totalCost > 0 ? totalCost / (1 - ebayFeePercent - paymentFeePercent) : 0;

    const recommended =
      totalCost > 0
        ? totalCost / (1 - ebayFeePercent - paymentFeePercent - targetProfit)
        : 0;

    const estimatedFees = salePrice > 0
      ? salePrice * ebayFeePercent + salePrice * paymentFeePercent + fixedFee
      : 0;
    const netProfit = salePrice > 0 ? salePrice - totalCost - estimatedFees : 0;
    const margin = salePrice > 0 ? (netProfit / salePrice) * 100 : 0;

    setText('previewTotalCost', formatMoney(totalCost));
    setText('previewBreakeven', formatMoney(breakeven));
    setText('previewRecommended', formatMoney(recommended));

    const profitEl = document.getElementById('previewProfit');
    profitEl.textContent = formatMoney(netProfit);
    profitEl.className = netProfit < 0 ? 'negative' : 'positive';

    const marginEl = document.getElementById('previewMargin');
    marginEl.textContent = margin.toFixed(1) + '%';
    marginEl.className = margin < 0 ? 'negative' : 'positive';
  }

  /* =========================
     PRODUCTS TABLE / MODAL / EDIT
  ========================= */

  function renderProducts(query = '') {
    const body = document.getElementById('productsTable');
    const search = query.trim().toLowerCase();
    const statusFilter = document.getElementById('filterStatus').value;
    const conditionFilter = document.getElementById('filterCondition').value;
    const modelFilter = document.getElementById('filterModel').value;
    const platformFilter = document.getElementById('filterPlatform').value;

    const products = (appData.products || []).filter(product => {
      if (!statusFilter && product['Product Status'] === 'Archived') return false;
      if (statusFilter && product['Product Status'] !== statusFilter) return false;
      if (conditionFilter && product['Condition'] !== conditionFilter) return false;
      if (modelFilter && product['Business Model'] !== modelFilter) return false;
      if (platformFilter && product['Sales Platform'] !== platformFilter) return false;

      if (!search) return true;

      return [
        product['SKU'],
        product['Product Name'],
        product['Supplier Name'],
        product['Business Model'],
        product['Condition']
      ]
        .join(' ')
        .toLowerCase()
        .includes(search);
    });

    if (!products.length) {
      body.innerHTML = `
        <tr>
          <td colspan="10" class="empty">No products found.</td>
        </tr>
      `;
      return;
    }

    body.innerHTML = products.map(product => `
      <tr>
        <td>${
          parseImageUrls(product['Image URL'])[0]
            ? `<img class="row-thumb" src="${escapeHtml(parseImageUrls(product['Image URL'])[0])}" alt="" onclick="openProductModal('${escapeHtml(product['SKU'])}')">`
            : ''
        }</td>
        <td>${escapeHtml(product['SKU'])}</td>
        <td>${escapeHtml(product['Product Name'])}</td>
        <td>${escapeHtml(product['Condition'])}</td>
        <td>${escapeHtml(product['Business Model'])}</td>
        <td>${formatMoney(product['Total Cost EUR'])}</td>
        <td>${formatMoney(product['Current Sale Price EUR'])}</td>
        <td>${formatMoney(product['Estimated Net Profit EUR'])}</td>
        <td>${statusBadge(product['Product Status'])}</td>
        <td>
          <div class="action-buttons">
            <button onclick="openProductModal('${escapeHtml(product['SKU'])}')">View</button>
            <button onclick="editProduct('${escapeHtml(product['SKU'])}')">Edit</button>
            ${
              product['Product Status'] !== 'Archived'
                ? `<button class="danger" onclick="archiveProductRow('${escapeHtml(product['SKU'])}')">Archive</button>`
                : ''
            }
          </div>
        </td>
      </tr>
    `).join('');
  }

  function editProduct(sku) {
    const product = (appData.products || []).find(p => p['SKU'] === sku);

    if (!product) return;

    showPage('add-product');
    editingProductSku = sku;

    const form = document.getElementById('productForm');
    form.reset();
    resetImageGallery();

    setField(form, 'sku', product['SKU']);
    setField(form, 'productName', product['Product Name']);
    setField(form, 'category', product['Category']);
    setField(form, 'condition', product['Condition']);
    setField(form, 'businessModel', product['Business Model']);
    setField(form, 'productStatus', product['Product Status']);
    setField(form, 'salesPlatform', product['Sales Platform']);
    setField(form, 'supplierName', product['Supplier Name']);
    setField(form, 'supplierPlatform', product['Supplier Platform']);
    setField(form, 'supplierLink', product['Supplier Link']);
    setField(form, 'mainEbayListingUrl', product['Main eBay Listing URL']);
    setField(form, 'supportLink1', product['Support Link 1']);
    setField(form, 'supportLink2', product['Support Link 2']);
    setField(form, 'supportLink3', product['Support Link 3']);
    setField(form, 'currency', product['Source Currency']);
    setField(form, 'purchasePriceLocal', product['Purchase Price Local']);
    setField(form, 'shippingToYouLocal', product['Shipping to You Local']);
    setField(form, 'customsDutyEur', product['Customs/Duty EUR']);
    setField(form, 'packagingEur', product['Packaging EUR']);
    setField(form, 'refurbishmentEur', product['Refurbishment EUR']);
    setField(form, 'dropshipCustomerShippingEur', product['Dropship Customer Shipping EUR']);
    setField(form, 'dropshipHandlingFeeEur', product['Dropship Handling Fee EUR']);
    setField(form, 'targetProfitPercent', product['Target Profit %']);
    setField(form, 'currentSalePriceEur', product['Current Sale Price EUR']);
    setField(form, 'supplierMoq', product['Supplier MOQ']);
    setField(form, 'leadTimeDays', product['Lead Time Days']);
    setField(form, 'dropshipSupported', product['Dropship Supported']);
    setField(form, 'acquisitionSource', product['Acquisition Source']);
    setField(form, 'acquisitionDate', String(product['Acquisition Date'] || '').substring(0, 10));
    setField(form, 'notes', product['Notes']);

    const urls = parseImageUrls(product['Image URL']);
    const fileIds = parseImageUrls(product['Image File ID']);
    currentImages = urls.map((url, index) => ({ url: url, fileId: fileIds[index] || '' }));
    syncImageFields(form);
    renderImageGallery();

    document.getElementById('productFormTitle').textContent = `Edit Product — ${sku}`;
    form.querySelector('button[type="submit"]').textContent = 'Update Product';

    updateConditionalFields();
    updateProfitPreview();
  }

  function resetProductFormForAdd() {
    editingProductSku = null;

    const form = document.getElementById('productForm');
    form.reset();
    resetImageGallery();

    document.getElementById('productFormTitle').textContent = 'Add Product';
    form.querySelector('button[type="submit"]').textContent = 'Save Product';

    updateConditionalFields();
    updateProfitPreview();
  }

  function openProductModal(sku) {
    const product = (appData.products || []).find(p => p['SKU'] === sku);

    if (!product) return;

    const body = document.getElementById('productModalBody');
    const pct = value => (Number(value || 0) * 100).toFixed(1) + '%';

    const sections = [
      {
        title: 'Overview',
        fields: [
          ['SKU', product['SKU']],
          ['Category', product['Category']],
          ['Condition', product['Condition']],
          ['Business Model', product['Business Model']],
          ['Status', product['Product Status']],
          ['Platform', product['Sales Platform']]
        ]
      },
      {
        title: 'Pricing & Profit Analysis',
        fields: [
          ['Total Cost', formatMoney(product['Total Cost EUR'])],
          ['Minimum (Breakeven) Price', formatMoney(product['Minimum Sale Price EUR'])],
          ['Recommended Price', formatMoney(product['Recommended Sale Price EUR'])],
          ['Current Sale Price', formatMoney(product['Current Sale Price EUR'])],
          ['Target Profit %', pct(product['Target Profit %'])],
          ['Estimated Net Profit', formatMoney(product['Estimated Net Profit EUR'])],
          ['Estimated Margin', pct(product['Estimated Profit Margin %'])]
        ]
      },
      {
        title: 'Cost Breakdown',
        fields: [
          ['Source Currency', product['Source Currency']],
          ['FX Rate to EUR', product['FX Rate to EUR']],
          ['Purchase Price', formatMoney(product['Purchase Price EUR'])],
          ['Shipping to You', formatMoney(product['Shipping to You EUR'])],
          ['Customs/Duty', formatMoney(product['Customs/Duty EUR'])],
          ['Packaging', formatMoney(product['Packaging EUR'])],
          ['Refurbishment', formatMoney(product['Refurbishment EUR'])],
          ['Dropship Customer Shipping', formatMoney(product['Dropship Customer Shipping EUR'])],
          ['Dropship Handling Fee', formatMoney(product['Dropship Handling Fee EUR'])]
        ]
      },
      {
        title: 'Fees',
        fields: [
          ['eBay Fee %', pct(product['eBay Fee %'])],
          ['Estimated eBay Fee', formatMoney(product['Estimated eBay Fee EUR'])],
          ['Payment Fee %', pct(product['Payment Fee %'])],
          ['Fixed Payment Fee', formatMoney(product['Fixed Payment Fee EUR'])],
          ['Estimated Payment Fee', formatMoney(product['Estimated Payment Fee EUR'])]
        ]
      },
      {
        title: 'Supplier & Logistics',
        fields: [
          ['Supplier Name', product['Supplier Name']],
          ['Supplier Platform', product['Supplier Platform']],
          ['Supplier MOQ', product['Supplier MOQ']],
          ['Lead Time (days)', product['Lead Time Days']],
          ['Dropship Supported', product['Dropship Supported']],
          ['Acquisition Source', product['Acquisition Source']],
          ['Acquisition Date', String(product['Acquisition Date'] || '').substring(0, 10)]
        ]
      },
      {
        title: 'Links',
        fields: [
          ['Supplier Link', product['Supplier Link'], true],
          ['Listing Link', product['Main eBay Listing URL'], true],
          ['Support Link 1', product['Support Link 1'], true],
          ['Support Link 2', product['Support Link 2'], true],
          ['Support Link 3', product['Support Link 3'], true]
        ]
      },
      {
        title: 'Notes',
        fields: [['Notes', product['Notes']]]
      }
    ];

    const images = parseImageUrls(product['Image URL']);

    body.innerHTML = `
      ${
        images.length
          ? `<div class="modal-gallery">${images.map(url => `
              <img src="${escapeHtml(url)}" alt="" onclick="window.open('${escapeHtml(url)}', '_blank')">
            `).join('')}</div>`
          : ''
      }
      ${sections.map(section => `
        <div class="modal-section">
          <h4>${escapeHtml(section.title)}</h4>
          <div class="modal-section-grid">
            ${section.fields.map(([label, value, isLink]) => `
              <div class="modal-field">
                <span>${escapeHtml(label)}</span>
                <strong>${
                  isLink && value
                    ? `<a href="${escapeHtml(value)}" target="_blank" rel="noopener">${escapeHtml(value)}</a>`
                    : escapeHtml(value || '—')
                }</strong>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    `;

    document.getElementById('productModal').classList.remove('hidden');
  }

  function closeProductModal() {
    document.getElementById('productModal').classList.add('hidden');
  }

  function archiveProductRow(sku) {
    if (!confirm(`Archive product ${sku}? It will be hidden from the active list.`)) return;

    google.script.run
      .withSuccessHandler(() => {
        showToast(`Product ${sku} archived.`);
        loadAppData();
      })
      .withFailureHandler(error => {
        showToast(error.message || 'Could not archive product.', true);
      })
      .archiveProduct(sku);
  }

  function renderCategoryOptions() {
    const datalist = document.getElementById('categoryOptions');
    const existing = new Set(
      Array.from(datalist.options).map(option => option.value)
    );

    (appData.products || [])
      .map(product => String(product['Category'] || '').trim())
      .filter(category => category && !existing.has(category))
      .forEach(category => {
        existing.add(category);
        const option = document.createElement('option');
        option.value = category;
        datalist.appendChild(option);
      });
  }
</script>
